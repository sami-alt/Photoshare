{% extends "layout.html" %}

{% block content %}
<div class="column">
<h1>Pictures</h1>
{% if pictures %}
  {% for picture in pictures %}
    <img src="/image/picture/{{picture['id']}}" width="100"/>
    <p><a href="/picture/{{picture['id']}}">{{picture['name']}}</a></p>
  {% endfor %}
  {% else %}
    <p>No pictures found</p>
  {% endif %}
  </div>
{% endblock %}
