{% extends "layout.html" %}

{% block content %}
<div id="pictures">
<h1>Pictures</h1>
{% if pictures %}
  {% for picture in pictures %}
  <p>
    {{picture['name']}}
  </p>
  <a href="/picture/{{picture['id']}}">
        <img src="/image/picture/{{picture['id']}}"/>
  </a>
  {% endfor %}
  {% else %}
    <p>No pictures found</p>
  {% endif %}
  </div>
{% endblock %}
