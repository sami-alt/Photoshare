{% extends "layout.html" %}

{% block content %}
<div id="my_comments">

    <p>Your comments</p>
    {% if comments %}
        {% for comment in comments %}
            <img src="/image/picture/{{comment['picture_id']}}" width="200"/>
            <p>{{comment.comment}}</p>
            <div class="divider"></div>
        {% endfor %}
    {% else %}
        <p>No comments made</p>
    {% endif %}
    
</div>
{% endblock %}
